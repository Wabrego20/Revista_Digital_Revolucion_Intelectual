<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR - Revolución Intelectual</title>

    <!-- Librería QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="qr-card">

        <h2 class="qr-title">
            Revolución Intelectual
        </h2>

        <div class="qr-container">

            <!-- Aquí se genera el QR -->
            <div id="qrcode"></div>

            <!-- Diseño del centro -->
            <div class="qr-logo">
                RI
            </div>

        </div>

        <p class="qr-text">
            Escanea para conocer más
        </p>

    </div>


    <script>

        /*
         * URL DE LA IMAGEN
         *
         * Reemplaza esta dirección por la URL
         * de tu imagen sobre la Revolución Intelectual.
         */
        const imagenRevolucion =
            "https://github.com/Wabrego20/Revista_Digital_Revolucion_Intelectual/blob/web/revolucion-intelectual.png";


        /*
         * Crear código QR
         */
        new QRCode(document.getElementById("qrcode"), {

            text: imagenRevolucion,

            width: 100,
            height: 100,

            colorDark: "#173b35",
            colorLight: "#ffffff",

            correctLevel: QRCode.CorrectLevel.H

        });

    </script>

</body>
</html>
